name: documental-benchmark

x-database: &database
  cpus: ${DB_CPUS:?Seleccione un archivo config/recursos/A.env, B.env o C.env}
  mem_limit: ${DB_MEMORY:?Falta DB_MEMORY}
  memswap_limit: ${DB_MEMORY}
  restart: "no"
  stop_grace_period: 60s
  labels:
    experiment.profile: ${PROFILE_ID:?Falta PROFILE_ID}
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "3"

services:
  mongodb:
    <<: *database
    profiles: [mongo]
    image: mongo:9.0.4-resolute@sha256:714cc3db1e396e5a464b8443ccde50e53283368809401f53f1997b684ddb5be0
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:?Falta MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?Falta MONGO_PASSWORD}
    ports: ["127.0.0.1:${MONGO_PORT:-27017}:27017"]
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
    healthcheck:
      test: [CMD, mongosh, --quiet, --eval, "const a=db.getSiblingDB('admin'); a.auth(process.env.MONGO_INITDB_ROOT_USERNAME,process.env.MONGO_INITDB_ROOT_PASSWORD); if(a.runCommand({ping:1}).ok!==1) quit(1)"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 5

  postgresql:
    <<: *database
    profiles: [postgres]
    image: postgres:18.6-trixie@sha256:979bccfde35445db618c65107d27d08c6c21339d8dc3ad4c830c6633947be0e4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Falta POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Falta POSTGRES_DB}
    command: [postgres, -c, max_connections=100, -c, shared_buffers=128MB, -c, work_mem=4MB, -c, log_temp_files=0, -c, timezone=UTC]
    shm_size: 256m
    ports: ["127.0.0.1:${POSTGRES_PORT:-55432}:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 5

  cadvisor:
    image: ghcr.io/google/cadvisor:0.60.6@sha256:b8e7d1093144fd088f425ff003d75a4aa405de075db78dae3bc563730b1bd07a
    privileged: true
    cgroup: host
    command:
      - --docker_only=true
      - --housekeeping_interval=1s
      - --max_housekeeping_interval=1s
      - --allow_dynamic_housekeeping=false
      - --store_container_labels=false
      - --whitelisted_container_labels=com.docker.compose.project,com.docker.compose.service,experiment.profile
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    ports: ["127.0.0.1:${CADVISOR_PORT:-8080}:8080"]
    cpus: 1
    mem_limit: 384m
    memswap_limit: 384m
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.12.1@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
    pid: host
    command:
      - --path.rootfs=/host
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|run/docker/.+)($$|/)
    volumes:
      # Docker Desktop no admite propagacion rslave en su montaje raiz.
      - /:/host:ro
    ports: ["127.0.0.1:${NODE_EXPORTER_PORT:-9100}:9100"]
    cpus: 0.5
    mem_limit: 128m
    memswap_limit: 128m
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=2GB
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports: ["127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"]
    cpus: 1
    mem_limit: 512m
    memswap_limit: 512m
    restart: unless-stopped

volumes:
  mongo_data:
  mongo_config:
  postgres_data:
  prometheus_data:
