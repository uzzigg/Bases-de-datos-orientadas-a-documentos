global:
  scrape_interval: 1s
  scrape_timeout: 1s
  evaluation_interval: 1s

scrape_configs:
  - job_name: cadvisor
    # Muestrear cada scrape, aunque cAdvisor repita el timestamp de housekeeping.
    honor_timestamps: false
    static_configs:
      - targets: [cadvisor:8080]
  - job_name: node-exporter
    static_configs:
      - targets: [node-exporter:9100]
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
